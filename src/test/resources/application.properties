spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway (below) now owns schema creation, same as in production, so tests
# actually exercise the real migrations (V1-V4) instead of Hibernate silently
# regenerating an approximation of the schema from the entity mappings that
# would miss anything Flyway adds without a matching entity annotation (e.g.
# V2's unique constraint on username).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.show-sql=false

spring.flyway.enabled=true

# Keep test runs quiet/deterministic: no scheduled relay polling in the
# background while assertions run.
app.outbox.relay.enabled=false

# Fixed test-only secret (not a real credential, never used outside ephemeral test JVMs).
jwt.secret=test-only-secret-key-do-not-use-in-production-min-32-bytes
jwt.access-token-expiration-ms=300000
jwt.refresh-token-expiration-ms=3600000

security.cors.allowed-origins=http://localhost:3000
