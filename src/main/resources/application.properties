server.port=5458

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:Tickets-DB}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Schema is Flyway-managed (see src/main/resources/db/migration); Hibernate
# only validates the mapped entities against it at startup and never alters
# it itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# "user" is a reserved word in Postgres (unlike MySQL, which silently
# backtick-escapes it); quote all identifiers so the "user" table/column
# names Hibernate generates don't collide with the SQL grammar.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.flyway.enabled=true
# The local dev DB's schema already existed (created by the old
# ddl-auto=update) before Flyway was introduced; baseline it as "V1 already
# applied" instead of failing on a non-empty, untracked schema. A no-op on a
# genuinely fresh database (CI, Testcontainers, a new dev machine) — Flyway
# just runs V1 there normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# No default: must be set in the environment (e.g. $env:JWT_SECRET in
# PowerShell), never committed. HS256 requires >= 32 bytes.
jwt.secret=${JWT_SECRET}
# Short-lived access token (5 min) sent as a Bearer token on every request;
# longer-lived refresh token (24h) exchanged at /refresh for a new access
# token. See JwtAuthenticationFilter for why a refresh token can never be
# used as a Bearer token directly.
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:300000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:86400000}

security.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
