# Local development defaults: verbose SQL/logging is helpful, not a leak
# risk, since this never runs against real user data.
spring.jpa.show-sql=true
logging.level.com.Coritech=DEBUG

# Local Postgres instance (the one visible in pgAdmin under "Servers").
# Everything here can still be overridden via the DB_* env vars. The
# password default below is for the local dev database only (per explicit
# user decision) — prod must always supply DB_PASSWORD via the environment.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:Tickets-DB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Prajwal@123}
