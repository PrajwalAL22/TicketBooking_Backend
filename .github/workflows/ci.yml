name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        # H2-backed unit tests plus the Testcontainers Postgres integration
        # test (ubuntu-latest runners have Docker available out of the box).
        run: ./mvnw -B verify
